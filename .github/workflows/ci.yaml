name: CI

on:
  push:
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install flake8 pytest

      - name: Run linter (flake8)
        run: |
          flake8 .

      - name: Run tests (pytest)
        run: |
          pytest

      - name: Log in to Docker Hub (only needed if images are private)
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Pull and run Docker images
        run: |
          docker pull terencegeobh/rakuten-app
          docker pull terencegeobh/mongodb
          docker run --rm terencegeobh/rakuten-app  # or whatever command you need
